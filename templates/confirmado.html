<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horas confirmadas</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{background:#fff;border-radius:16px;padding:44px 28px;text-align:center;max-width:320px;width:90%;box-shadow:0 2px 12px rgba(0,0,0,.1)}
    .icon{font-size:3.2rem;margin-bottom:16px}
    h1{color:#1a1a2e;font-size:1.25rem;margin-bottom:8px}
    p{color:#555;font-size:.88rem;line-height:1.5}
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>¡Gracias, {{ nombre.split()[0] }}!</h1>
    <p>Tus horas fueron confirmadas correctamente.<br>Podés cerrar esta página.</p>
  </div>
</body>
</html>
