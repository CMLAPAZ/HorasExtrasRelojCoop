<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM Horas Extras — Períodos</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f0f4f8;padding:24px;color:#1a1a2e}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    h1{font-size:1.3rem}
    .nav{display:flex;gap:14px}
    .nav a{font-size:.82rem;color:#1d4ed8;text-decoration:none}
    .nav a:hover{text-decoration:underline}
    .card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px}
    .card-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:14px;font-weight:600}
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
    .card-title-inline{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:#888;font-weight:600}
    .selector{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
    .field{display:flex;flex-direction:column;gap:4px}
    label{font-size:.82rem;font-weight:600;color:#555}
    select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:.9rem;font-family:inherit;min-width:260px}
    select:focus{outline:none;border-color:#1a1a2e}
    .btn{padding:11px 24px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;align-self:flex-end}
    .btn:hover{background:#2d2d4e}
    .btn-red{padding:8px 16px;background:#dc2626;color:#fff;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer}
    .btn-red:hover{background:#b91c1c}
    .btn-green{padding:8px 16px;background:#059669;color:#fff;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer}
    .btn-green:hover{background:#047857}
    .btn-print{padding:8px 16px;background:#6b7280;color:#fff;border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer}
    .btn-print:hover{background:#4b5563}
    .acciones{display:flex;gap:8px;flex-wrap:wrap}
    .tabla-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th{background:#f8f9fb;text-align:left;padding:9px 10px;color:#555;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #e5e7eb}
    td{padding:9px 10px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
    tr:last-child td{border-bottom:none}
    .ot50{color:#d97706;font-weight:600}
    .ot100{color:#dc2626;font-weight:600}
    .emp-nombre{font-weight:600}
    .ok{color:#065f46;font-weight:600}
    .pend{color:#92400e}
    .depto-header td{background:#e0e7ff;color:#3730a3;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;padding:7px 10px}
    .subtotal-row td{background:#f0fdf4;font-weight:700;font-size:.82rem;color:#065f46;border-top:1px solid #bbf7d0}
    .total-row td{background:#1a1a2e;color:#fff;font-weight:700;border-top:2px solid #1a1a2e}
    .total-row .ot50{color:#fcd34d}
    .total-row .ot100{color:#fca5a5}
    .vacio{color:#888;font-size:.85rem;padding:20px 0;text-align:center}
    .hidden{display:none}
    .aviso{font-size:.82rem;color:#92400e;background:#fffbeb;border:1px solid #fcd34d;padding:10px 14px;border-radius:8px;margin-bottom:14px}
    .filtro-deptos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
    .filtro-label{font-size:.78rem;font-weight:600;color:#555}
    .depto-btn{padding:4px 12px;border:1px solid #d1d5db;border-radius:20px;font-size:.78rem;cursor:pointer;background:#fff;color:#555}
    .depto-btn.activo{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
    .print-header{display:none}
    .print-footer{display:none}

    @media print {
      body{background:#fff;padding:10px}
      .topbar,.nav,.selector-card,.acciones,.btn-red,.filtro-deptos{display:none !important}
      .card{box-shadow:none;border:1px solid #e5e7eb;margin-bottom:10px}
      .print-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;border-bottom:2px solid #1a1a2e;padding-bottom:10px}
      .print-header-left h2{font-size:1.1rem;color:#1a1a2e}
      .print-header-left p{font-size:.78rem;color:#555;margin-top:3px}
      .print-rango{font-size:.85rem;color:#1a1a2e;font-weight:600;margin-top:2px}
      .print-header-right{text-align:right;font-size:.78rem;color:#555}
      .print-header-right strong{display:block;font-size:.9rem;color:#1a1a2e}
      .print-footer{display:flex;justify-content:space-between;margin-top:24px;padding-top:10px;border-top:1px solid #e5e7eb;font-size:.75rem;color:#888}
      .firma-linea{border-top:1px solid #1a1a2e;width:180px;margin-top:28px;padding-top:4px;font-size:.75rem;color:#1a1a2e;font-weight:600}
      .depto-header td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .total-row td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>

<div class="topbar">
  <h1>Gestión de períodos</h1>
  <div class="nav">
    <a href="/">← Panel principal</a>
    <a href="/historial">Historial</a>
    <a href="/periodos/historial">Cierres</a>
    <a href="/logout">Salir</a>
  </div>
</div>

<!-- Selector -->
<div class="card selector-card">
  <div class="card-title">Seleccionar período</div>
  {% if semanas %}
  <div class="selector">
    <div class="field">
      <label for="departamento">Departamento</label>
      <select id="departamento" onchange="filtrarSemanasPorDepartamento()" required>
        <option value="">Seleccionar departamento</option>
        {% for d in departamentos %}
        <option value="{{ d }}">{{ d }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="desde">Desde semana</label>
      <select id="desde" disabled>
        {% for s in semanas %}
        <option value="{{ s.numero }}" data-fd="{{ s.fecha_desde }}" data-fh="{{ s.fecha_hasta }}">Sem. {{ s.numero }}{% if s.departamento %} · {{ s.departamento }}{% endif %}{% if s.fecha_desde %} ({{ s.fecha_desde }} → {{ s.fecha_hasta }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label for="hasta">Hasta semana</label>
      <select id="hasta" disabled>
        {% for s in semanas %}
        <option value="{{ s.numero }}" data-fd="{{ s.fecha_desde }}" data-fh="{{ s.fecha_hasta }}" {% if loop.last %}selected{% endif %}>Sem. {{ s.numero }}{% if s.departamento %} · {{ s.departamento }}{% endif %}{% if s.fecha_desde %} ({{ s.fecha_desde }} → {{ s.fecha_hasta }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <button type="button" class="btn" onclick="previsualizar()">Ver resumen</button>
  </div>
  {% else %}
  <div class="vacio">No hay semanas registradas. Procesá un archivo desde el panel principal.</div>
  {% endif %}
</div>

<!-- Resumen -->
<div class="card hidden" id="resumen-wrap">
  <div class="print-header">
    <div class="print-header-left">
      <h2 id="print-titulo"></h2>
      <p id="print-rango" class="print-rango"></p>
      <p id="print-fecha"></p>
    </div>
    <div class="print-header-right">
      <strong>CM Vector Systems</strong>
    </div>
  </div>
  <div class="print-footer">
    <span id="print-fecha-footer"></span>
    <div class="firma-linea">{{ firma }}</div>
  </div>
  <div class="card-header">
    <span class="card-title-inline" id="resumen-titulo">Resumen del período</span>
    <div class="acciones">
      <button type="button" class="btn-print" onclick="window.print()">Imprimir / PDF</button>
      <button type="button" class="btn-green" onclick="descargarCSV()">Descargar CSV</button>
      <button type="button" class="btn-red" onclick="cerrarPeriodo()">Cerrar período ✓</button>
    </div>
  </div>
  <div class="aviso hidden" id="aviso-pendientes"></div>
  <div class="filtro-deptos hidden" id="filtro-deptos"></div>
  <div id="resumen-body"></div>
</div>

<script>
let _desde = 1, _hasta = 1;
let _todosEmpleados = [];
let _deptosActivos  = new Set();
const _semanasDisponibles = {{ semanas | tojson }};

function etiquetaSemana(s) {
  const partes = [
    `Sem. ${s.num_depto || s.numero}`,
    s.departamento || 'Todos',
    `lote global ${s.numero}`,
  ];
  if (s.fecha_desde || s.fecha_hasta) partes.push(`${s.fecha_desde || ''} -> ${s.fecha_hasta || ''}`);
  if (s.archivo) partes.push(s.archivo);
  return partes.join(' · ');
}

function limpiarSelectorSemana(selectEl) {
  selectEl.innerHTML = '';
  selectEl.disabled = true;
}

function cargarOpcionesSemana(selectEl, semanas, seleccionarUltima) {
  selectEl.innerHTML = '';
  semanas.forEach((s, idx) => {
    const opt = document.createElement('option');
    opt.value = s.numero;
    opt.dataset.fd = s.fecha_desde || '';
    opt.dataset.fh = s.fecha_hasta || '';
    opt.dataset.departamento = s.departamento || 'Todos';
    opt.textContent = etiquetaSemana(s);
    if (seleccionarUltima && idx === semanas.length - 1) opt.selected = true;
    selectEl.appendChild(opt);
  });
  selectEl.disabled = !semanas.length;
}

function filtrarSemanasPorDepartamento() {
  const departamento = document.getElementById('departamento').value;
  const desdeEl = document.getElementById('desde');
  const hastaEl = document.getElementById('hasta');
  document.getElementById('resumen-wrap').classList.add('hidden');
  document.getElementById('aviso-pendientes').classList.add('hidden');
  document.getElementById('filtro-deptos').classList.add('hidden');

  if (!departamento) {
    limpiarSelectorSemana(desdeEl);
    limpiarSelectorSemana(hastaEl);
    return;
  }

  const semanas = _semanasDisponibles
    .filter(s => (s.departamento || 'Todos') === departamento)
    .sort((a, b) => a.numero - b.numero);
  cargarOpcionesSemana(desdeEl, semanas, false);
  cargarOpcionesSemana(hastaEl, semanas, true);
}

async function previsualizar() {
  const departamento = document.getElementById('departamento').value;
  if (!departamento) { alert('Selecciona un departamento primero.'); return false; }
  if (document.getElementById('desde').disabled || document.getElementById('hasta').disabled) {
    alert('No hay semanas activas para el departamento seleccionado.');
    return false;
  }
  _desde = parseInt(document.getElementById('desde').value);
  _hasta = parseInt(document.getElementById('hasta').value);
  if (_hasta < _desde) { alert('La semana "hasta" debe ser mayor o igual a "desde".'); return false; }

  const res  = await fetch(`/periodo/resumen?desde=${_desde}&hasta=${_hasta}`);
  const data = await res.json();
  const wrap = document.getElementById('resumen-wrap');

  document.getElementById('resumen-titulo').textContent  = `Período: semanas ${_desde} a ${_hasta}`;
  const ahora = new Date().toLocaleString('es-AR');
  const tituloPeriodo = `Periodo: ${departamento} · Semanas ${_desde} a ${_hasta}`;
  document.getElementById('print-titulo').textContent       = `Período: Semanas ${_desde} a ${_hasta}`;
  document.getElementById('print-titulo').textContent       = tituloPeriodo;
  document.getElementById('print-fecha').textContent        = `Generado: ${ahora}`;
  document.getElementById('print-fecha-footer').textContent = `Generado: ${ahora}`;

  // Calcular rango de fechas real desde los atributos de los <option>
  let fdMin = '', fhMax = '';
  document.querySelectorAll('#desde option, #hasta option').forEach(opt => {
    const n = parseInt(opt.value);
    if (n >= _desde && n <= _hasta && opt.dataset.departamento === departamento) {
      const fd = opt.dataset.fd || '', fh = opt.dataset.fh || '';
      if (fd && (!fdMin || fd < fdMin)) fdMin = fd;
      if (fh && (!fhMax || fh > fhMax)) fhMax = fh;
    }
  });
  document.getElementById('print-rango').textContent =
    fdMin ? `${fdMin}  al  ${fhMax}` : '';

  if (!data.length) {
    document.getElementById('resumen-body').innerHTML = '<div class="vacio">Sin datos en este rango.</div>';
    document.getElementById('aviso-pendientes').classList.add('hidden');
    document.getElementById('filtro-deptos').classList.add('hidden');
    wrap.classList.remove('hidden');
    return true;
  }

  _todosEmpleados = data;

  // Departamentos disponibles
  const deptos = [...new Set(data.map(e => e.departamento || '—'))].sort();
  _deptosActivos = new Set(deptos);
  renderFiltroDeptos(deptos);

  const pendientes = data.filter(e => !e.confirmado);
  const avisoEl = document.getElementById('aviso-pendientes');
  if (pendientes.length) {
    avisoEl.textContent = `${pendientes.length} empleado(s) aún no confirmaron — sus totales se incluyen sin descripciones.`;
    avisoEl.classList.remove('hidden');
  } else {
    avisoEl.classList.add('hidden');
  }

  renderTabla();
  wrap.classList.remove('hidden');
  wrap.scrollIntoView({ behavior:'smooth' });
  return true;
}

function renderFiltroDeptos(deptos) {
  const el = document.getElementById('filtro-deptos');
  if (deptos.length <= 1) { el.classList.add('hidden'); return; }
  el.innerHTML = '<span class="filtro-label">Filtrar:</span>';
  deptos.forEach(d => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'depto-btn activo';
    btn.textContent = d;
    btn.dataset.depto = d;
    btn.onclick = () => {
      if (_deptosActivos.has(d)) {
        if (_deptosActivos.size === 1) return;
        _deptosActivos.delete(d);
        btn.classList.remove('activo');
      } else {
        _deptosActivos.add(d);
        btn.classList.add('activo');
      }
      renderTabla();
    };
    el.appendChild(btn);
  });
  el.classList.remove('hidden');
}

function parseHM(s) {
  if (!s || s === '0h') return 0;
  let mins = 0;
  const h = s.match(/(\d+)h/), m = s.match(/(\d+)m/);
  if (h) mins += parseInt(h[1]) * 60;
  if (m) mins += parseInt(m[1]);
  return mins;
}
function fmtMin(mins) {
  if (mins <= 0) return '0h';
  const h = Math.floor(mins / 60), m = mins % 60;
  return m ? `${h}h ${String(m).padStart(2,'0')}m` : `${h}h`;
}

function renderTabla() {
  const body = document.getElementById('resumen-body');
  const data = _todosEmpleados.filter(e => _deptosActivos.has(e.departamento || '—'));

  if (!data.length) {
    body.innerHTML = '<div class="vacio">Sin empleados para los departamentos seleccionados.</div>';
    return;
  }

  const grupos = {};
  data.forEach(e => {
    const d = e.departamento || '—';
    if (!grupos[d]) grupos[d] = [];
    grupos[d].push(e);
  });

  let totGen50 = 0, totGen100 = 0, totGenComidas = 0, totGenFrancos = 0, totGenTardanzas = 0, totGenEmp = 0;

  let html = `<div class="tabla-wrap"><table>
    <thead><tr>
      <th>Legajo</th><th>Nombre</th>
      <th>OT 50%</th><th>OT 100%</th>
      <th>Comidas</th><th>Francos</th><th>Tardanzas</th>
      <th>Semanas</th><th>Estado</th>
    </tr></thead><tbody>`;

  Object.keys(grupos).sort().forEach(depto => {
    const empleados = grupos[depto];
    totGenEmp += empleados.length;
    let sub50 = 0, sub100 = 0, subComidas = 0, subFrancos = 0, subTardanzas = 0;

    html += `<tr class="depto-header"><td colspan="9">${depto} — ${empleados.length} empleado(s)</td></tr>`;

    empleados.forEach(e => {
      sub50        += parseHM(e.ot50   || '0h');
      sub100       += parseHM(e.ot100  || '0h');
      subComidas   += e.comidas   || 0;
      subFrancos   += e.francos   || 0;
      subTardanzas += e.tardanzas || 0;
      const estado = e.confirmado ? '<span class="ok">✓</span>' : '<span class="pend">⏳</span>';
      html += `<tr>
        <td>${e.legajo}</td>
        <td class="emp-nombre">${e.nombre}</td>
        <td class="ot50">${e.ot50  || '0h'}</td>
        <td class="ot100">${e.ot100 || '0h'}</td>
        <td>${e.comidas   || 0}</td>
        <td>${e.francos   || 0}</td>
        <td>${e.tardanzas || 0}</td>
        <td>${(e.semanas || []).join(', ')}</td>
        <td>${estado}</td>
      </tr>`;
    });

    totGen50        += sub50;
    totGen100       += sub100;
    totGenComidas   += subComidas;
    totGenFrancos   += subFrancos;
    totGenTardanzas += subTardanzas;

    html += `<tr class="subtotal-row">
      <td colspan="2"><strong>Subtotal ${depto}</strong></td>
      <td class="ot50"><strong>${fmtMin(sub50)}</strong></td>
      <td class="ot100"><strong>${fmtMin(sub100)}</strong></td>
      <td><strong>${subComidas}</strong></td>
      <td><strong>${subFrancos}</strong></td>
      <td><strong>${subTardanzas}</strong></td>
      <td colspan="2">${empleados.length} emp.</td>
    </tr>`;
  });

  html += `<tr class="total-row">
    <td colspan="2"><strong>TOTAL GENERAL — ${totGenEmp} empleados</strong></td>
    <td class="ot50"><strong>${fmtMin(totGen50)}</strong></td>
    <td class="ot100"><strong>${fmtMin(totGen100)}</strong></td>
    <td><strong>${totGenComidas}</strong></td>
    <td><strong>${totGenFrancos}</strong></td>
    <td><strong>${totGenTardanzas}</strong></td>
    <td colspan="2">—</td>
  </tr>`;

  html += '</tbody></table></div>';
  body.innerHTML = html;
}

function descargarCSV() {
  window.location.href = `/periodo/exportar?desde=${_desde}&hasta=${_hasta}`;
}

async function cerrarPeriodo() {
  // Si todavía no se previsualizó, cargarlo primero
  if (document.getElementById('resumen-wrap').classList.contains('hidden')) {
    await previsualizar();
  }
  if (!confirm(
    `¿Cerrar el período semanas ${_desde} a ${_hasta}?\n\n` +
    `• Se generará el informe de cierre para imprimir / guardar como PDF.\n` +
    `• El contador de semanas se reiniciará a 1.\n\n` +
    `Esta acción no se puede deshacer.`
  )) return;

  const fd = new FormData();
  fd.append('desde', _desde);
  fd.append('hasta', _hasta);
  const res  = await fetch('/periodo/cerrar', { method:'POST', body:fd });
  const data = await res.json();
  if (data.error) { alert('Error: ' + data.error); return; }

  // Preparar encabezado de impresión con título de cierre
  const ahora = new Date().toLocaleString('es-AR');
  document.getElementById('print-titulo').textContent =
    `INFORME DE CIERRE — Semanas ${_desde} a ${_hasta}`;
  document.getElementById('print-fecha').textContent  = `Cerrado: ${ahora}`;
  document.getElementById('print-fecha-footer').textContent = `Cerrado: ${ahora}`;

  // Ocultar botones para la impresión
  document.querySelector('.acciones').style.display = 'none';
  document.getElementById('filtro-deptos').style.display = 'none';

  // Imprimir / guardar PDF y luego volver al inicio
  window.addEventListener('afterprint', () => { window.location.href = '/'; }, { once: true });
  window.print();
}
</script>
</body>
</html>
