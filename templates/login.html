<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM Horas Extras — Ingresar</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f0f4f8;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .box{background:#fff;border-radius:16px;padding:40px 32px;width:90%;max-width:340px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
    h1{font-size:1.2rem;color:#1a1a2e;margin-bottom:6px}
    p{font-size:.82rem;color:#888;margin-bottom:24px}
    label{display:block;font-size:.82rem;font-weight:600;color:#555;margin-bottom:6px}
    .pass-wrap{position:relative}
    .pass-wrap input{width:100%;padding:10px 44px 10px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:.95rem;font-family:inherit}
    .pass-wrap input:focus{outline:none;border-color:#1a1a2e}
    .eye-btn{position:absolute;right:0;top:0;height:100%;width:40px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;color:#9ca3af;padding:0;border-radius:0 8px 8px 0}
    .eye-btn:hover{color:#555}
    .eye-timer{position:absolute;right:38px;top:50%;transform:translateY(-50%);font-size:.7rem;font-weight:700;color:#1a1a2e;background:#e0e7ff;border-radius:999px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .15s}
    .eye-timer.visible{opacity:1}
    .eye-icon-off{display:none}
    .btn{display:block;width:100%;padding:12px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:14px}
    .btn:hover{background:#2d2d4e}
    .error{color:#dc2626;font-size:.82rem;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h1>CM Horas Extras</h1>
    <p>Acceso supervisor</p>
    <form method="POST">
      <label for="password">Contraseña</label>
      <div class="pass-wrap">
        <input type="password" id="password" name="password" autofocus placeholder="••••••••">
        <span class="eye-timer" id="eye-timer"></span>
        <button type="button" class="eye-btn" id="eye-btn" onclick="togglePass()" title="Mostrar contraseña">
          <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="icon-eye-off" class="eye-icon-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
      <button type="submit" class="btn">Ingresar</button>
    </form>
  </div>
<script>
let _eyeTimer = null;
const SECS = 3;
function togglePass() {
  const inp    = document.getElementById('password');
  const timer  = document.getElementById('eye-timer');
  const eyeOn  = document.getElementById('icon-eye');
  const eyeOff = document.getElementById('icon-eye-off');
  if (_eyeTimer) { clearInterval(_eyeTimer); _eyeTimer = null; }
  if (inp.type === 'text') {
    inp.type = 'password';
    eyeOn.classList.remove('eye-icon-off'); eyeOff.classList.add('eye-icon-off');
    timer.classList.remove('visible');
    return;
  }
  inp.type = 'text';
  eyeOn.classList.add('eye-icon-off'); eyeOff.classList.remove('eye-icon-off');
  let left = SECS;
  timer.textContent = left;
  timer.classList.add('visible');
  _eyeTimer = setInterval(() => {
    left--;
    if (left <= 0) {
      clearInterval(_eyeTimer); _eyeTimer = null;
      inp.type = 'password';
      eyeOn.classList.remove('eye-icon-off'); eyeOff.classList.add('eye-icon-off');
      timer.classList.remove('visible');
    } else {
      timer.textContent = left;
    }
  }, 1000);
}
</script>
</body>
</html>
